<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gobble Dash — a turkey escape game: outrun the farmer, dodge the ovens and the falling carving knives, hide in the haystacks, and escape Thanksgiving.">
<title>Gobble Dash — Turkey Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2118; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Dash, a turkey escape game: run from the farmer, jump the ovens and fences, hide in haystacks, dodge the falling carving knives and grab corn"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
